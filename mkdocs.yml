site_name: Ariadne
site_description: Research documentation for Ariadne, a four-stage TPS discovery and CeeSs prioritization framework.
site_author: Zhaorui Jiang
repo_url: https://github.com/zhaorui-bi/Ariadne
repo_name: zhaorui-bi/Ariadne
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: "Copyright &copy; Zhaorui Jiang"

theme:
  name: material
  language: en
  logo: logo.png
  favicon: logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Method: method.md
  - ESM Type Model: esm-type.md
  - Advanced Usage: advanced-usage.md
  - Tutorials: tutorials.md
  - CLI Reference: cli-reference.md
  - Outputs: outputs.md
  - Documentation Site: documentation-site.md
  - FAQ: faq.md
  - Citation: citation.md
